version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cdc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: chicken_counting
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chicken_counting"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-8070}:${PORT:-8070}"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/chicken_counting
      - VIDEO_PATH=/samples/Rekaman_2.MOV
    volumes:
      - ./samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  counter:
    build:
      context: ./services/counter
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - API_SYNC_URL=http://api:${PORT:-8070}/api/v1/sync/batch
      - LINE_ID=line-1
      - DB_PATH=/data/counter_outbox.db
      - VIDEO_PATH=/samples/Rekaman_2.MOV
      - LOOP_VIDEO=1
      - LINE_DIRECTION=right
      - TARGET_FPS=30.0
    volumes:
      - counter_data:/data
      - ./samples:/samples:ro
    restart: unless-stopped
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  counter_data:
