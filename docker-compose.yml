version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-8070}:${PORT:-8070}"
    environment:
      - DATABASE_URL=sqlite:////data/api_central.db
    volumes:
      - api_data:/data

  counter:
    build:
      context: .
      dockerfile: services/counter/Dockerfile
    env_file:
      - .env
    environment:
      - API_SYNC_URL=http://api:${PORT:-8070}/api/v1/sync/batch
      - LINE_ID=line-1
      - DB_PATH=/data/counter_outbox.db
      - VIDEO_PATH=/samples/Rekaman_2.MOV
      - LOOP_VIDEO=1
    volumes:
      - counter_data:/data
      - ./samples:/samples:ro
    restart: unless-stopped
    depends_on:
      - api

volumes:
  api_data:
  counter_data:
