[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-chicken-counting"
version = "0.1.0"
description = "Poultry Counting Service and Dashboard"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
